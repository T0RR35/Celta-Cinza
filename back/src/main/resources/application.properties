spring.application.name=CeltaCinza

# Lê o arquivo backend/.env (se existir). Rode o back-end de dentro da pasta backend/.
spring.config.import=optional:file:.env[.properties]

# ---------- Servidor ----------
server.port=${SERVER_PORT:8080}

# ---------- Banco de dados: Supabase (PostgreSQL) ----------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Poucas conexões: o plano gratuito do Supabase tem limite
spring.datasource.hikari.maximum-pool-size=5

# ---------- JPA / Hibernate ----------
# update = o Hibernate cria e ajusta as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET}
# 24 horas
app.jwt.expiration-ms=86400000

# ---------- CORS (origem do front-end) ----------
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}